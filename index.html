/* ===== GESTION DES 7 JOURNÉES ===== */

function copie(x){return JSON.parse(JSON.stringify(x))}
function tableauVide(){return Array.from({length:24},()=>0)}
function heuresVides(){return Array.from({length:24},()=>[0,0,0,0])}

var joursNoms=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
var datesDepart=["23 novembre","24 novembre","25 novembre","26 novembre","27 novembre","28 novembre","29 novembre"];

function creerJour(date,heures,activations,notifications,apps,extra){
  return {
    date:date,
    H:copie(heures),
    A:copie(activations),
    N:copie(notifications),
    LT:copie(apps),
    extra:extra
  };
}

var semaine=[
  creerJour(datesDepart[0],H,A,N,LT,28),
  creerJour(datesDepart[1],H,A,N,LT,28),
  creerJour(datesDepart[2],heuresVides(),tableauVide(),tableauVide(),[],0),
  creerJour(datesDepart[3],heuresVides(),tableauVide(),tableauVide(),[],0),
  creerJour(datesDepart[4],heuresVides(),tableauVide(),tableauVide(),[],0),
  creerJour(datesDepart[5],heuresVides(),tableauVide(),tableauVide(),[],0),
  creerJour(datesDepart[6],heuresVides(),tableauVide(),tableauVide(),[],0)
];

var jourActif=0;
var renduOriginal=renderD;

try{
  var sauvegarde=localStorage.getItem("tempsEcranSemaine");
  if(sauvegarde){
    var ancienne=JSON.parse(sauvegarde);
    if(Array.isArray(ancienne)&&ancienne.length===7)semaine=ancienne;
  }
}catch(e){}

function sauvegarderSemaine(){
  try{localStorage.setItem("tempsEcranSemaine",JSON.stringify(semaine))}catch(e){}
}

function chargerJour(){
  var j=semaine[jourActif];
  H=copie(j.H);
  A=copie(j.A);
  N=copie(j.N);
  LT=copie(j.LT);
  DATE=j.date;
  T=[0,0,0,0];
  H.forEach(function(r){r.forEach(function(v,k){T[k]+=Number(v)||0})});
  TOT=S(T)+(Number(j.extra)||0);
  SA=S(A);
  SN=S(N);
}

function totalApplications(){
  return S(LT.map(function(a){return Number(a[1])||0}));
}

function ajusterHeures(cible){
  var actuel=0;
  H.forEach(function(r){actuel+=S(r)});
  if(actuel===0)return;
  var facteur=cible/actuel;
  var nouveau=0;
  H.forEach(function(r){
    for(var k=0;k<4;k++){
      r[k]=Math.round(r[k]*facteur);
      nouveau+=r[k];
    }
  });
  var ecart=cible-nouveau;
  for(var i=23;i>=0;i--){
    for(var k=3;k>=0;k--){
      if(H[i][k]>0||ecart>0){
        H[i][k]=Math.max(0,H[i][k]+ecart);
        return;
      }
    }
  }
}

function editeurHTML(){
  var j=semaine[jourActif];
  var html='<div class="card" style="margin:12px 0 24px;border:1px solid var(--grid)">';
  html+='<div style="font-size:20px;font-weight:650;margin-bottom:12px">Modifier la semaine</div>';
  html+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px">';
  joursNoms.forEach(function(n,i){
    html+='<button data-jour="'+i+'" style="border:0;border-radius:12px;padding:10px 2px;background:'+(i===jourActif?'var(--blue)':'var(--btn)')+';color:white;font-weight:600">'+n.slice(0,3)+'</button>';
  });
  html+='</div>';
  html+='<div style="font-weight:600;margin-bottom:6px">Date de '+joursNoms[jourActif].toLowerCase()+'</div>';
  html+='<input data-date type="text" value="'+j.date+'" placeholder="Ex. 30 novembre" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--grid);background:var(--bg);color:var(--tx);font-size:16px;margin-bottom:15px">';
  html+='<div style="font-weight:600;margin-bottom:8px">Statistiques générales</div>';
  html+='<label style="display:block;color:var(--sub);font-size:14px">Temps d’écran total (minutes)</label>';
  html+='<input data-total type="number" min="0" value="'+(S(j.H.flat())+Number(j.extra||0))+'" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--grid);background:var(--bg);color:var(--tx);font-size:17px;margin:5px 0 12px">';
  html+='<label style="display:block;color:var(--sub);font-size:14px">Activations</label>';
  html+='<input data-activations type="number" min="0" value="'+S(j.A)+'" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--grid);background:var(--bg);color:var(--tx);font-size:17px;margin:5px 0 12px">';
  html+='<label style="display:block;color:var(--sub);font-size:14px">Notifications</label>';
  html+='<input data-notifications type="number" min="0" value="'+S(j.N)+'" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--grid);background:var(--bg);color:var(--tx);font-size:17px;margin:5px 0 18px">';
  html+='<div style="font-weight:600;margin-bottom:8px">Applications</div>';
  j.LT.forEach(function(a,i){
    html+='<div style="display:grid;grid-template-columns:1fr 85px;gap:8px;margin-bottom:8px">';
    html+='<input data-appname="'+i+'" value="'+String(a[0]).replace(/"/g,'&quot;')+'" style="min-width:0;width:100%;padding:10px;border-radius:9px;border:1px solid var(--grid);background:var(--bg);color:var(--tx);font-size:15px">';
    html+='<input data-apptime="'+i+'" type="number" min="0" value="'+a[1]+'" style="width:100%;padding:10px;border-radius:9px;border:1px solid var(--grid);background:var(--bg);color:var(--tx);font-size:15px">';
    html+='</div>';
  });
  html+='<button data-addapp style="width:100%;padding:12px;border:0;border-radius:10px;background:var(--btn);color:var(--blue);font-size:16px;margin:5px 0 18px">+ Ajouter une application</button>';
  html+='<div style="font-weight:600;margin-bottom:5px">Répartition par heure</div>';
  html+='<div style="font-size:13px;color:var(--sub);margin-bottom:10px">Tu peux modifier chaque partie colorée des graphiques horaires.</div>';
  html+='<div style="display:grid;grid-template-columns:40px repeat(4,1fr);gap:5px;font-size:12px;color:var(--sub);margin-bottom:6px"><span>Heure</span><span>Social</span><span>Autres</span><span>Product.</span><span>Autre</span></div>';
  j.H.forEach(function(r,i){
    html+='<div style="display:grid;grid-template-columns:40px repeat(4,1fr);gap:5px;margin-bottom:5px;align-items:center">';
    html+='<span style="font-size:12px;color:var(--sub)">'+String(i).padStart(2,"0")+'h</span>';
    r.forEach(function(v,k){
      html+='<input data-heure="'+i+'" data-cat="'+k+'" type="number" min="0" value="'+v+'" style="min-width:0;width:100%;padding:7px 2px;text-align:center;border-radius:7px;border:1px solid var(--grid);background:var(--bg);color:var(--tx);font-size:13px">';
    });
    html+='</div>';
  });
  html+='<div style="font-size:13px;color:var(--sub);margin-top:12px">Les modifications sont sauvegardées automatiquement sur cet appareil.</div>';
  html+='</div>';
    return html;
}

function pageG(){
  return '<div class="sh" style="margin:20px 0 9px 20px">Général</div>'+editeurHTML();
}

function actualiserJour(){
  var j=semaine[jourActif];
  j.H=copie(H);j.A=copie(A);j.N=copie(N);j.LT=copie(LT);
  j.date=DATE;
  j.extra=TOT-S(T);
  sauvegarderSemaine();
}

function afficherJour(){
  chargerJour();
  renduOriginal();
  $("app").insertAdjacentHTML("afterbegin",editeurHTML());
}

renderD=renduOriginal;

var renduPageOriginal=render;
render=function(){
  chargerJour();
  renduPageOriginal();
};

$("app").addEventListener("click",function(e){
  var bouton=e.target.closest("[data-jour]");
  if(bouton){
    actualiserJour();
    jourActif=Number(bouton.dataset.jour);
    render();
    return;
  }
  if(e.target.closest("[data-addapp]")){
    actualiserJour();
    LT.push(["Nouvelle app",0]);
    render();
  }
});

$("app").addEventListener("change",function(e){
  var el=e.target;
  var j=semaine[jourActif];

  if(el.hasAttribute("data-date")){
    DATE=el.value;
    j.date=DATE;
  }

  if(el.hasAttribute("data-total")){
    var voulu=Math.max(0,Number(el.value)||0);
    var somme=0;H.forEach(function(r){somme+=S(r)});
    j.extra=voulu-somme;
  }

  if(el.hasAttribute("data-activations")){
    var vouluA=Math.max(0,Number(el.value)||0);
    A[23]=Math.max(0,A[23]+vouluA-S(A));
  }

  if(el.hasAttribute("data-notifications")){
    var vouluN=Math.max(0,Number(el.value)||0);
    N[23]=Math.max(0,N[23]+vouluN-S(N));
  }

  if(el.hasAttribute("data-appname")){
    LT[Number(el.dataset.appname)][0]=el.value;
    ajusterHeures(totalApplications());
  }

  if(el.hasAttribute("data-apptime")){
    LT[Number(el.dataset.apptime)][1]=Math.max(0,Number(el.value)||0);
    ajusterHeures(totalApplications());
  }

  if(el.hasAttribute("data-heure")){
    H[Number(el.dataset.heure)][Number(el.dataset.cat)]=Math.max(0,Number(el.value)||0);
  }

  actualiserJour();
  render();
});

/* Graphique hebdomadaire : une barre par journée */
wk=function(segs,cols,max,yl,avgc){
  var valeurs=semaine.map(function(j){
    var total=[0,0,0,0];
    j.H.forEach(function(r){r.forEach(function(v,k){total[k]+=Number(v)||0})});
    var couleur=String(cols[0]);
    if(segs.length===4)return total;
    if(couleur.indexOf("c2")>-1)return [S(j.A)];
    if(couleur.indexOf("red")>-1)return [S(j.N)];
    return [S(total)+Number(j.extra||0)];
  });
  var totaux=valeurs.map(function(v){return S(v)});
  var maximum=Math.max(max,...totaux,1);
  var moyenne=S(totaux)/7;
  var h='<div class="cw"><div class="pl">'+grid(4,7);
  valeurs.forEach(function(v,i){
    var t=S(v),p=t/maximum*100;
    h+='<div class="sl" style="left:'+i*100/7+'%;width:'+100/7+'%"><div class="bar" style="height:'+p+'%">';
    v.forEach(function(x,k){
      if(x)h+='<i style="height:'+(x/t*100)+'%;background:'+cols[k]+'"></i>';
    });
    h+='</div></div>';
  });
  h+='<div class="avg" style="bottom:'+(moyenne/maximum*100)+'%;border-color:'+avgc+'"></div></div>';
  h+='<div class="ya">'+yl.map(function(y){return '<span style="bottom:'+y[0]+'%">'+y[1]+'</span>'}).join("")+'</div></div>';
  h+='<div class="lb">'+["L","M","M","J","V","S","D"].map(function(l,i){return '<span style="left:'+i*100/7+'%">'+l+'</span>'}).join("")+'</div>';
  return h;
};
